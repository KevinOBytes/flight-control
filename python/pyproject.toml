[project]
name = "vectorflight-tools"
version = "0.1.0"
description = "Offline validation, geometry search, and analysis tools for VectorFlight"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "sympy>=1.12",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
