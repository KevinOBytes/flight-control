[workspace]
resolver = "2"
members = [
    "crates/vf-core",
    "crates/vf-model",
    "crates/vf-allocator",
    "crates/vf-faults",
    "crates/vf-hal",
    "crates/vf-can",
    "crates/vf-runtime",
    "crates/vf-sim",
]

[workspace.dependencies]
nalgebra = { version = "0.33.0", features = ["serde-serialize"] }

# Optimization solver
osqp = "0.6.3"

# Serialization and configuration
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
toml = "0.8.19"

# Error handling
thiserror = "1.0.63"

# Diagnostics and logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Testing and validation
approx = "0.5.1"
proptest = "1.5.0"

# CAN-FD reference adapter
socketcan = "3.3.0"
